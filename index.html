<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas - Snack</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="header">
        <h1>🍿 Snack Express para la USB religiosa</h1>
        <p>Sistema de Ventas para Cochabamba Dona sabi</p>
    </header>

    <main class="container">

        <!-- Sección de Productos -->
        <section class="productos">
            <h2>Productos Disponibles</h2>
            <div id="lista-productos" class="productos-grid">
                <!-- Los productos se cargan desde JS -->
            </div>
        </section>

        <!-- Sección del Carrito -->
        <section class="carrito">
            <h2>🛒 Carrito de Compras</h2>
            <div id="carrito-items" class="carrito-items">
                <p class="carrito-vacio">El carrito está vacío</p>
            </div>
            <div class="carrito-resumen">
                <div class="total">
                    <span>Total:</span>
                    <span id="total-precio">$0.00</span>
                </div>
                <button id="btn-cobrar" class="btn btn-cobrar" disabled>Cobrar</button>
                <button id="btn-limpiar" class="btn btn-limpiar">Limpiar Carrito</button>
            </div>
        </section>

    </main>

    <!-- Modal de Cobro -->
    <div id="modal-cobro" class="modal" style="display: none;">
        <div class="modal-contenido">
            <h3>Confirmar Venta</h3>
            <div id="resumen-venta"></div>
            <div class="modal-campo">
                <label for="pago-cliente">Monto recibido ($):</label>
                <input type="number" id="pago-cliente" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="cambio">
                <span>Cambio:</span>
                <span id="cambio-monto">$0.00</span>
            </div>
            <div class="modal-botones">
                <button id="btn-confirmar" class="btn btn-cobrar">Confirmar Venta</button>
                <button id="btn-cancelar" class="btn btn-limpiar">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Notificación -->
    <div id="notificacion" class="notificacion" style="display: none;"></div>

    <footer class="footer">
        <p>&copy; 2026 Snack Express - Sistema de Ventas</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
